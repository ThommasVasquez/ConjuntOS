packages:
  - "."
  - mobile

# pnpm v11 reads these from here, not .npmrc — hoisted layout is required for
# Expo/Metro/babel plugin resolution to work under a monorepo.
nodeLinker: hoisted
publicHoistPattern:
  - "*"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - '@config-plugins/react-native-webrtc@15.0.2'
  - '@expo/cli@57.0.17'
  - '@expo/fingerprint@0.20.9'
  - '@expo/local-build-cache-provider@57.0.7'
  - '@expo/metro-config@57.0.9'
  - '@expo/metro-runtime@57.0.12'
  - '@expo/prebuild-config@57.0.13'
  - '@expo/router-server@57.0.7'
  - expo-asset@57.0.13
  - expo-constants@57.0.13
  - expo-file-system@57.0.5
  - expo-modules-core@57.0.12
  - expo-modules-jsi@57.0.5
  - expo@57.0.15
  - '@expo/ui@57.0.12'
  - expo-audio@57.0.4
  - expo-camera@57.0.4
  - expo-dev-client@57.0.14
  - expo-dev-launcher@57.0.14
  - expo-dev-menu@57.0.14
  - expo-image-manipulator@57.0.12
  - expo-image-picker@57.0.12
  - expo-linking@57.0.7
  - expo-notifications@57.0.13
  - expo-router@57.0.15
  - expo-sharing@57.0.14
