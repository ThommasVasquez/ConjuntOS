# docker-compose.prod.yml — overrides de PRODUCCIÓN.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Requiere un archivo .env (junto a este compose) con, al menos:
#   LIVEKIT_API_KEY, LIVEKIT_API_SECRET, LIVEKIT_URL
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT
# Ver DEPLOYMENT_ENV.md para el detalle, la generación de llaves y el runbook de TURN.

services:
  db:
    # ponytail: 100x concurrency bump, requested explicitly. Ceiling: ~3000 live
    # PG backends ≈ 5-10MB each → can OOM the box under real 1000-user load.
    # Rollback: delete this `command:` line (back to PG default max_connections=100).
    command: >
      postgres
      -c max_connections=3500
      -c shared_buffers=512MB

  minio:
    # Object storage holds resident personal data. In prod: strong creds are
    # required (no minioadmin default) and the S3/console ports are NOT published
    # to the host — reach MinIO only over the internal compose network.
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set in production}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set in production}
    ports: []

  livekit:
    # Pasa de modo --dev a config real con TURN/TLS embebido.
    command: --config /etc/livekit/livekit.yaml
    restart: unless-stopped
    environment:
      # Las keys vienen del entorno (no se versionan).
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    ports:
      - "5349:5349"               # TURN/TLS (TCP)
      - "5349:5349/udp"           # TURN/TLS (UDP)
      - "30000-30049:30000-30049/udp"  # TURN relay range (acotado en livekit.yaml)
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml:ro
      # Certificado TLS para el dominio TURN (turn.crt + turn.key).
      - ./certs/livekit:/etc/livekit/certs:ro

  backend:
    restart: unless-stopped
    environment:
      # Trust root: MUST be supplied in prod. `:?` makes `compose up` fail fast if
      # missing, instead of silently inheriting the base dev default.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in production}
      # Object storage credentials — required in prod (no MinIO defaults).
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set in production}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set in production}
      # Runtime role-switch (RoleSwitcher) is a tester-only backdoor: OFF by
      # default in production. Set TESTER_EMAILS explicitly only for staging.
      TESTER_EMAILS: ${TESTER_EMAILS:-}
      # Never auto-approve payments in prod: mock is off unless explicitly opted in.
      PAYMENTS_ALLOW_MOCK: ${PAYMENTS_ALLOW_MOCK:-}
      # Citofonía / Asamblea (LiveKit) — valores reales desde el entorno.
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_URL: ${LIVEKIT_URL:-wss://livekit.conjuntos.app}
      # Web Push VAPID — el "despertador" de la citofonía.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@conjuntos.app}
      # ponytail: 100x DB pool (30→3000), requested explicitly. Must stay under the
      # db service's max_connections=3500. Rollback: set back to "30".
      DB_POOL_SIZE: ${DB_POOL_SIZE:-3000}
