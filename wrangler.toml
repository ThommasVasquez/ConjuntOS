name = "en-conjunto"
pages_build_output_dir = ".vercel/output/static"
compatibility_date = "2026-03-31"
compatibility_flags = [ "nodejs_compat" ]


[env.production]
compatibility_flags = [ "nodejs_compat" ]

# Public, build-time-safe vars only. Secrets (DATABASE_URL, GEMINI_API_KEY,
# VAPID_PRIVATE_KEY) are NOT committed — those belong to the Rust backend now and,
# where the frontend genuinely needs one, must be set via Cloudflare's encrypted
# store (`wrangler secret put` / Pages dashboard), never in this file.
# The frontend also needs NEXT_PUBLIC_API_URL pointed at the production backend.
#
# AUTH_URL / NEXTAUTH_URL se eliminaron: next-auth ya no es dependencia del
# proyecto (no está en package.json y nada lo importa) — la sesión la maneja
# AuthProvider contra el backend Rust. Mantenerlas solo servía para chocar con
# las variables del dashboard de Pages ("Binding name 'AUTH_URL' already in use").
[env.production.vars]
NEXT_PUBLIC_API_URL = "https://api.conjuntos.app"
# Señalización wss de LiveKit. Hoy el cliente toma la URL del token que emite el
# backend (LiveRoom.tsx usa `data.url`), así que esta var es informativa — pero se
# mantiene alineada con LIVEKIT_URL del backend para que no diverjan.
