<meta charset="utf-8" />
<title>ConjuntOS® 🏘️ — Guía de funcionalidades</title>
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --font-display:
      "SF Pro Rounded", ui-rounded, "Nunito", "Segoe UI", system-ui, sans-serif;
    --font-body:
      -apple-system, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    --navy: #20308a;
    --navy-deep: #141e5c;
    --mint: #22a874;
    --mint-2: #2fbf87;
    --amber: #f2a63b;
    --bg: #f1f4fc;
    --surface: #ffffff;
    --surface-2: #e9edfa;
    --frame-a: #eef2fd;
    --frame-b: #dce4fa;
    --ink: #161a33;
    --ink-2: #565c7c;
    --line: #dfe4f3;
    --brand: #20308a;
    --accent: #22a874;
    --shadow: 0 24px 60px -26px rgba(20, 30, 92, 0.42);
    --shadow-sm: 0 6px 20px -10px rgba(20, 30, 92, 0.35);
    --glow: rgba(47, 191, 135, 0.32);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --navy: #8ca0ff;
      --navy-deep: #0a1130;
      --mint: #37d598;
      --mint-2: #4fe3ac;
      --bg: #080d28;
      --surface: #111a44;
      --surface-2: #0d1538;
      --frame-a: #eaf0fd;
      --frame-b: #cbd7f5;
      --ink: #eaedfb;
      --ink-2: #a3abd4;
      --line: #26315f;
      --brand: #9db0ff;
      --accent: #37d598;
      --shadow: 0 26px 70px -24px rgba(0, 0, 0, 0.7);
      --shadow-sm: 0 8px 24px -12px rgba(0, 0, 0, 0.6);
      --glow: rgba(55, 213, 152, 0.28);
    }
  }
  :root[data-theme="light"] {
    --navy: #20308a;
    --navy-deep: #141e5c;
    --mint: #22a874;
    --mint-2: #2fbf87;
    --bg: #f1f4fc;
    --surface: #ffffff;
    --surface-2: #e9edfa;
    --frame-a: #eef2fd;
    --frame-b: #dce4fa;
    --ink: #161a33;
    --ink-2: #565c7c;
    --line: #dfe4f3;
    --brand: #20308a;
    --accent: #22a874;
    --shadow: 0 24px 60px -26px rgba(20, 30, 92, 0.42);
    --shadow-sm: 0 6px 20px -10px rgba(20, 30, 92, 0.35);
    --glow: rgba(47, 191, 135, 0.32);
  }
  :root[data-theme="dark"] {
    --navy: #8ca0ff;
    --navy-deep: #0a1130;
    --mint: #37d598;
    --mint-2: #4fe3ac;
    --bg: #080d28;
    --surface: #111a44;
    --surface-2: #0d1538;
    --frame-a: #eaf0fd;
    --frame-b: #cbd7f5;
    --ink: #eaedfb;
    --ink-2: #a3abd4;
    --line: #26315f;
    --brand: #9db0ff;
    --accent: #37d598;
    --shadow: 0 26px 70px -24px rgba(0, 0, 0, 0.7);
    --shadow-sm: 0 8px 24px -12px rgba(0, 0, 0, 0.6);
    --glow: rgba(55, 213, 152, 0.28);
  }

  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    height: 100%;
  }
  body {
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(60% 55% at 82% 12%, var(--glow), transparent 60%),
      radial-gradient(
        50% 50% at 8% 90%,
        rgba(32, 48, 138, 0.16),
        transparent 60%
      );
  }

  /* ---------- shell ---------- */
  .deck {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px clamp(16px, 3.4vw, 44px);
    position: relative;
    z-index: 5;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-display);
    font-weight: 800;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .brand__dot {
    width: 26px;
    height: 26px;
    border-radius: 9px;
    display: grid;
    place-items: center;
    background: linear-gradient(140deg, var(--brand), var(--accent));
    box-shadow: var(--shadow-sm);
  }
  .brand__dot svg {
    width: 15px;
    height: 15px;
    fill: #fff;
  }
  .brand b {
    font-size: 1.06rem;
  }
  .brand span {
    color: var(--ink-2);
    font-weight: 600;
    font-size: 0.82rem;
    margin-left: 2px;
  }
  .spacer {
    flex: 1;
  }
  .tprogress {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 3px;
    width: 100%;
    background: transparent;
  }
  .tprogress i {
    display: block;
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, var(--brand), var(--accent));
    transition: width 0.5s cubic-bezier(0.4, 0, 0.1, 1);
  }
  .iconbtn {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    width: 40px;
    height: 40px;
    border-radius: 12px;
    cursor: pointer;
    display: grid;
    place-items: center;
    box-shadow: var(--shadow-sm);
    transition:
      transform 0.15s ease,
      border-color 0.15s ease;
  }
  .iconbtn:hover {
    transform: translateY(-1px);
    border-color: var(--accent);
  }
  .iconbtn svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: var(--ink);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ---------- stage ---------- */
  .stage {
    flex: 1;
    position: relative;
    min-height: 0;
  }
  .slide {
    position: absolute;
    inset: 0;
    padding: 4px clamp(16px, 3.4vw, 52px) 8px;
    display: grid;
    grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
    gap: clamp(20px, 3.2vw, 56px);
    align-items: center;
    opacity: 0;
    visibility: hidden;
    transform: translateY(14px) scale(0.99);
    transition:
      opacity 0.5s ease,
      transform 0.5s ease,
      visibility 0.5s;
  }
  .slide.is-active {
    opacity: 1;
    visibility: visible;
    transform: none;
  }
  .slide.rev {
    grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr);
  }
  .slide.rev .media {
    order: 2;
  }

  /* media */
  .media {
    position: relative;
    display: grid;
    place-items: center;
    min-height: 0;
    height: 100%;
  }
  .media__frame {
    position: relative;
    width: min(100%, 460px);
    aspect-ratio: 1/1;
    border-radius: 30px;
    background: linear-gradient(155deg, var(--frame-a), var(--frame-b));
    box-shadow: var(--shadow);
    border: 1px solid rgba(255, 255, 255, 0.55);
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .media__frame::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 30px;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.7),
      inset 0 0 0 1px rgba(32, 48, 138, 0.05);
  }
  .media__frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    animation: float 7s ease-in-out infinite;
  }
  .media__tag {
    position: absolute;
    left: -8px;
    bottom: 22px;
    z-index: 3;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 9px 14px;
    border-radius: 14px;
    box-shadow: var(--shadow-sm);
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .media__tag b {
    width: 9px;
    height: 9px;
    border-radius: 3px;
    background: var(--accent);
  }
  .media__no {
    position: absolute;
    right: -6px;
    top: 20px;
    z-index: 3;
    font-family: var(--font-display);
    font-weight: 800;
    background: linear-gradient(140deg, var(--brand), var(--accent));
    color: #fff;
    width: 52px;
    height: 52px;
    border-radius: 16px;
    display: grid;
    place-items: center;
    box-shadow: var(--shadow-sm);
    font-size: 0.86rem;
    letter-spacing: 0.02em;
  }
  @keyframes float {
    0%,
    100% {
      transform: translateY(0);
    }
    50% {
      transform: translateY(-10px);
    }
  }

  /* body */
  .body {
    min-width: 0;
    max-height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .eyebrow {
    font-family: var(--font-display);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    font-size: 0.76rem;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .eyebrow::before {
    content: "";
    width: 26px;
    height: 2px;
    border-radius: 2px;
    background: var(--accent);
  }
  .title {
    font-family: var(--font-display);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.02;
    font-size: clamp(1.9rem, 3.5vw, 3rem);
    margin: 0 0 12px;
    text-wrap: balance;
    color: var(--ink);
  }
  .intro {
    color: var(--ink-2);
    font-size: clamp(1rem, 1.35vw, 1.16rem);
    line-height: 1.5;
    margin: 0 0 22px;
    max-width: 58ch;
  }
  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    min-height: 0;
    overflow: auto;
    padding-right: 4px;
  }
  .cards.one {
    grid-template-columns: 1fr;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px 16px;
    box-shadow: var(--shadow-sm);
    position: relative;
  }
  .card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 14px;
    width: 3px;
    height: 20px;
    border-radius: 3px;
    background: linear-gradient(180deg, var(--brand), var(--accent));
  }
  .card h3 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1rem;
    margin: 0 0 4px;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .card p {
    margin: 0;
    color: var(--ink-2);
    font-size: 0.88rem;
    line-height: 1.45;
  }

  /* cover */
  .cover .title {
    font-size: clamp(3rem, 8vw, 6rem);
    line-height: 0.94;
    margin-bottom: 18px;
  }
  .cover .lede {
    color: var(--ink-2);
    font-size: clamp(1.05rem, 1.7vw, 1.35rem);
    line-height: 1.5;
    max-width: 52ch;
    margin: 0 0 24px;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    margin-bottom: 26px;
  }
  .chip {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.82rem;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 14px;
    box-shadow: var(--shadow-sm);
  }
  .chip.accent {
    background: linear-gradient(140deg, var(--brand), var(--accent));
    color: #fff;
    border: none;
  }
  .hint {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    color: var(--ink-2);
    font-size: 0.85rem;
    font-weight: 600;
  }
  .kbd {
    font-family: var(--font-body);
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 7px;
    padding: 2px 8px;
    box-shadow: var(--shadow-sm);
  }

  /* closing */
  .close .cta {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-top: 8px;
  }
  .btn {
    font-family: var(--font-display);
    font-weight: 800;
    border: none;
    border-radius: 14px;
    padding: 13px 22px;
    cursor: pointer;
    background: linear-gradient(140deg, var(--brand), var(--accent));
    color: #fff;
    box-shadow: var(--shadow-sm);
    font-size: 0.98rem;
  }
  .sign {
    color: var(--ink-2);
    font-style: italic;
    margin-top: 18px;
    font-size: 0.95rem;
  }

  /* ---------- controls ---------- */
  .controls {
    position: relative;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 10px 16px 20px;
  }
  .counter {
    font-family: var(--font-display);
    font-weight: 800;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }
  .counter em {
    color: var(--ink-2);
    font-style: normal;
    font-weight: 700;
  }
  .dots {
    display: flex;
    gap: 7px;
    align-items: center;
    max-width: 52vw;
    flex-wrap: wrap;
    justify-content: center;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    border: none;
    background: var(--line);
    cursor: pointer;
    padding: 0;
    transition: all 0.2s ease;
  }
  .dot:hover {
    background: var(--ink-2);
  }
  .dot.on {
    background: linear-gradient(140deg, var(--brand), var(--accent));
    width: 26px;
    border-radius: 5px;
  }
  .nav {
    display: flex;
    gap: 10px;
  }
  .nav button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation: none !important;
      transition: opacity 0.2s ease !important;
    }
  }
  @media (max-width: 860px) {
    body {
      overflow: auto;
    }
    .stage {
      min-height: 0;
    }
    .slide {
      position: relative;
      inset: auto;
      grid-template-columns: 1fr;
      opacity: 1;
      visibility: visible;
      transform: none;
      display: none;
      padding-top: 14px;
    }
    .slide.rev {
      grid-template-columns: 1fr;
    }
    .slide.is-active {
      display: grid;
    }
    .slide.rev .media {
      order: 0;
    }
    .media__frame {
      width: min(78vw, 340px);
    }
    .cards {
      overflow: visible;
    }
    .dots {
      display: none;
    }
  }
</style>

        <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" /></svg>
      </button>

  </footer>
</div>

          "Seguimiento de casos entre unidades, con miembro responsable y sesiones de mediación.",
        ],
        [
          "Acta de mediación (Art. 58)",
          "Se genera el acta y queda firmable digitalmente por todas las partes.",
        ],
      ],
    },

    {
      img: "security",
      eyebrow: "Huéspedes",
      title: "Pases temporales y Mi Estancia",
      intro:
        "Acceso controlado para invitados, con una vista propia para el huésped.",
      cards: [
        [
          "Pase temporal",
          "Código único, fechas y permisos por área (gimnasio, piscina, entrada, vehículo, asamblea).",
        ],
        [
          "Cuenta de huésped",
          "Si se indica un correo, se crea automáticamente una cuenta temporal para el invitado.",
        ],
        [
          "Validación y expiración",
          "Portería valida el código; los pases vencidos se expiran solos y el propietario puede revocarlos.",
        ],
        [
          "Mi Estancia",
          "El huésped ve a su anfitrión, check-in/out, permisos y puede reservar zonas comunes.",
        ],
      ],
    },

    {
      img: "ai",
      rev: true,
      eyebrow: "Inteligencia artificial",
      title: "Otto, tu copiloto con IA",
      intro:
        "Un asistente fundamentado en la Ley 675 que orienta a residentes y apoya a la administración.",
      cards: [
        [
          "Asistente legal y de la app",
          "Otto resuelve dudas sobre la Ley 675 y guía a los residentes entre los módulos, con preguntas sugeridas.",
        ],
        [
          "Copiloto del administrador",
          "En asamblea responde sobre el orden del día, redacta el acta y concilia opiniones en un consenso.",
        ],
        [
          "Documentos y recordatorios",
          "Avisa antes de que venzan el SOAT, la tecnomecánica y el carné de vacunas de las mascotas.",
        ],
      ],
    },

    {
      kind: "close",
      img: "wave",
      eyebrow: "Y además",
      title: "Todo listo para tu conjunto",
      intro:
        "Una experiencia cuidada en cada dispositivo, con seguridad y confiabilidad de fondo.",
      cards: [
        [
          "Publicidad y analítica",
          "Banners programables con métricas de impresiones, clics y CTR, y panel demográfico del conjunto.",
        ],
        [
          "Multi-dispositivo",
          "Responsive en celular, tablet y computador, con navegación por rol y modo claro/oscuro.",
        ],
        [
          "Seguridad y confiabilidad",
          "Cifrado, copias de seguridad automáticas y monitoreo del sistema 24/7.",
        ],
      ],
      cta: true,
    },
  ];

  const $ = (s) => document.querySelector(s);
  const stage = $("#stage"),
    dotsEl = $("#dots");
  let i = 0;
  const total = SLIDES.length;

  function iconOf(idx) {
    return `<span class="media__no">${String(idx).padStart(2, "0")}</span>`;
  }

  function render() {
    stage.innerHTML = SLIDES.map((s, idx) => {
      const media = `<div class="media">
        <div class="media__frame"><img src="${CAPI[s.img]}" alt="Mascota Capi de EN-CONJUNTO ilustrando ${s.title}"></div>
        ${s.tag ? `<div class="media__tag"><b></b>${s.tag}</div>` : ""}
        ${s.kind !== "cover" && s.kind !== "close" ? iconOf(idx) : ""}
      </div>`;

      let body;
      if (s.kind === "cover") {
        body = `<div class="body cover">
        <div class="eyebrow">${s.eyebrow}</div>
        <h1 class="title">${s.title}</h1>
        <p class="lede">${s.lede}</p>
        <div class="chips">${s.chips.map((c) => `<span class="chip${c[1] ? " accent" : ""}">${c[0]}</span>`).join("")}</div>
        <span class="hint">Navega con <span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> o los puntos</span>
      </div>`;
      } else {
        const cards = `<div class="cards${s.one ? " one" : ""}">${s.cards.map((c) => `<div class="card"><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join("")}</div>`;
        const cta = s.cta
          ? `<div class="close"><div class="cta"><button class="btn">Solicita una demostración</button><span class="hint">EN-CONJUNTO</span></div><p class="sign">Tecnología que une comunidades.</p></div>`
          : "";
        body = `<div class="body${s.kind === "close" ? " close" : ""}">
        <div class="eyebrow">${s.eyebrow}</div>
        <h2 class="title">${s.title}</h2>
        <p class="intro">${s.intro}</p>
        ${cards}${cta}
      </div>`;
      }
      return `<section class="slide${s.rev ? " rev" : ""}" role="group" aria-roledescription="diapositiva" aria-label="${idx + 1} de ${total}: ${s.title}">${media}${body}</section>`;
    }).join("");

    dotsEl.innerHTML = SLIDES.map(
      (s, idx) =>
        `<button class="dot" role="tab" aria-label="${idx + 1}. ${s.title}" data-i="${idx}"></button>`,
    ).join("");
    $("#tot").textContent = String(total).padStart(2, "0");
    go(0, true);
  }

  function go(n, silent) {
    i = Math.max(0, Math.min(total - 1, n));
    document
      .querySelectorAll(".slide")
      .forEach((el, idx) => el.classList.toggle("is-active", idx === i));
    document.querySelectorAll(".dot").forEach((el, idx) => {
      el.classList.toggle("on", idx === i);
      el.setAttribute("aria-selected", idx === i ? "true" : "false");
    });
    $("#cur").textContent = String(i + 1).padStart(2, "0");
    $("#tbar").style.width = ((i + 1) / total) * 100 + "%";
    $("#prev").disabled = i === 0;
    $("#next").disabled = i === total - 1;
    if (!silent) {
      const a = document.querySelectorAll(".slide")[i];
      if (a) a.scrollIntoView({ block: "nearest" });
    }
  }

  $("#prev").onclick = () => go(i - 1);
  $("#next").onclick = () => go(i + 1);
  dotsEl.onclick = (e) => {
    const b = e.target.closest(".dot");
    if (b) go(+b.dataset.i);
  };
  addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") {
      e.preventDefault();
      go(i + 1);
    } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
      e.preventDefault();
      go(i - 1);
    } else if (e.key === "Home") {
      go(0);
    } else if (e.key === "End") {
      go(total - 1);
    }
  });
  // swipe
  let sx = 0;
  stage.addEventListener("touchstart", (e) => (sx = e.touches[0].clientX), {
    passive: true,
  });
  stage.addEventListener(
    "touchend",
    (e) => {
      const dx = e.changedTouches[0].clientX - sx;
      if (Math.abs(dx) > 50) go(i + (dx < 0 ? 1 : -1));
    },
    { passive: true },
  );

  // theme
  const sun = `<circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></g>`;
  const moon = `<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>`;
  const root = document.documentElement,
    tIcon = $("#themeIcon");
  function isDark() {
    const t = root.getAttribute("data-theme");
    return t ? t === "dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  }
  function paintTheme() {
    tIcon.innerHTML = isDark() ? sun : moon;
  }
  $("#theme").onclick = () => {
    root.setAttribute("data-theme", isDark() ? "light" : "dark");
    paintTheme();
  };
  matchMedia("(prefers-color-scheme:dark)").addEventListener(
    "change",
    paintTheme,
  );

  render();
  paintTheme();
</script>
